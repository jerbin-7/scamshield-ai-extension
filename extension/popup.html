<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>ScamShield AI</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-shell">

    <header class="ss-header">
      <div class="ss-header-brand">
        <img src="icons/icon32.png" alt="" class="ss-logo" />
        <div class="ss-header-text">
          <span class="ss-title">ScamShield<span class="ss-title-accent">AI</span></span>
          <span class="ss-subtitle" id="statusLine">Initializing…</span>
        </div>
      </div>
      <button class="ss-icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13a7.6 7.6 0 0 0 .1-1 7.6 7.6 0 0 0-.1-1l2-1.55a.5.5 0 0 0 .12-.63l-1.9-3.3a.5.5 0 0 0-.6-.22l-2.36.95a7.5 7.5 0 0 0-1.73-1l-.36-2.5a.5.5 0 0 0-.5-.42h-3.8a.5.5 0 0 0-.5.42l-.36 2.5a7.5 7.5 0 0 0-1.73 1l-2.36-.95a.5.5 0 0 0-.6.22l-1.9 3.3a.5.5 0 0 0 .12.63L4.5 11a7.6 7.6 0 0 0 0 2l-2 1.55a.5.5 0 0 0-.12.63l1.9 3.3a.5.5 0 0 0 .6.22l2.36-.95c.53.42 1.1.76 1.73 1l.36 2.5a.5.5 0 0 0 .5.42h3.8a.5.5 0 0 0 .5-.42l.36-2.5a7.5 7.5 0 0 0 1.73-1l2.36.95a.5.5 0 0 0 .6-.22l1.9-3.3a.5.5 0 0 0-.12-.63L19.4 13Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main class="ss-main">

      <!-- Risk Gauge (signature scan-ring element) -->
      <section class="ss-gauge-card ss-glass" id="gaugeCard">
        <div class="ss-gauge-wrap">
          <svg viewBox="0 0 160 160" class="ss-gauge-svg" id="gaugeSvg">
            <circle cx="80" cy="80" r="68" class="ss-gauge-track" />
            <circle cx="80" cy="80" r="68" class="ss-gauge-progress" id="gaugeProgress" />
            <g class="ss-scanring" id="scanRing" opacity="0.55">
              <circle cx="80" cy="80" r="74" fill="none" stroke="url(#scanGrad)" stroke-width="1.5" stroke-dasharray="6 14" />
            </g>
            <defs>
              <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#00e5ff"/>
                <stop offset="100%" stop-color="#7b61ff"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="ss-gauge-center">
            <span class="ss-gauge-score" id="gaugeScore">--</span>
            <span class="ss-gauge-percent">%</span>
          </div>
        </div>
        <div class="ss-gauge-info">
          <span class="ss-badge ss-badge-neutral" id="verdictBadge"><span class="ss-dot"></span>Scanning…</span>
          <span class="ss-domain" id="domainLabel">—</span>
        </div>
      </section>

      <!-- Explainable AI reasons -->
      <section class="ss-panel ss-glass" id="reasonsPanel">
        <div class="ss-panel-title">Why this verdict</div>
        <ul class="ss-reasons-list" id="reasonsList">
          <li class="ss-reason-item ss-reason-empty">No signals yet.</li>
        </ul>
      </section>

      <!-- Quick actions -->
      <section class="ss-actions">
        <button class="ss-btn ss-btn-primary" id="rescanBtn">↻ Rescan this page</button>
        <button class="ss-btn ss-btn-ghost" id="allowBtn" hidden>Trust this site</button>
      </section>

      <!-- Feature toggles -->
      <section class="ss-panel ss-glass">
        <div class="ss-panel-title">Protection modules</div>
        <div class="ss-toggle-row">
          <span>URL Detection</span>
          <label class="ss-switch"><input type="checkbox" id="toggleUrl" /><span class="ss-slider"></span></label>
        </div>
        <div class="ss-toggle-row">
          <span>QR Detection</span>
          <label class="ss-switch"><input type="checkbox" id="toggleQr" /><span class="ss-slider"></span></label>
        </div>
        <div class="ss-toggle-row">
          <span>Email Detection</span>
          <label class="ss-switch"><input type="checkbox" id="toggleEmail" /><span class="ss-slider"></span></label>
        </div>
        <div class="ss-toggle-row">
          <span>Screenshot Detection</span>
          <label class="ss-switch"><input type="checkbox" id="toggleScreenshot" /><span class="ss-slider"></span></label>
        </div>
      </section>

      <!-- Stats footer -->
      <section class="ss-stats-row">
        <button class="ss-stat-link" id="historyLink">
          <span class="ss-stat-num" id="statScans">0</span>
          <span class="ss-stat-label">Scans today</span>
        </button>
        <div class="ss-stat-divider"></div>
        <button class="ss-stat-link" id="historyLink2">
          <span class="ss-stat-num" id="statBlocked">0</span>
          <span class="ss-stat-label">Threats blocked</span>
        </button>
      </section>

    </main>

    <footer class="ss-footer">
      <button class="ss-footer-btn" id="footerHistory">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 0 3-6.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 4v5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        History
      </button>
      <button class="ss-footer-btn" id="footerSettings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.6"/></svg>
        Settings
      </button>
      <span class="ss-footer-version">v1.0.0</span>
    </footer>

  </div>

  <script src="shared/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
